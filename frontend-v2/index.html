<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Tema: no uses <script> inline — en Electron (file://) choca con CSP (script-src 'self').
      El boot va en `src/main.tsx` (módulo), mismo criterio que getStoredUiTheme() / applyUiThemeToDocument.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Social Club</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
